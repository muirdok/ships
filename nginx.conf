events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Redirect all HTTP traffic directly to HTTPS
    server {
        listen 80;
        server_name giants-of-the-sea.madata.ru www.giants-of-the-sea.madata.ru;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Production HTTPS Server Configuration
    server {
        listen 443 ssl;
        http2 on; # Enable for modern performance
        server_name giants-of-the-sea.madata.ru www.giants-of-the-sea.madata.ru;

        # SSL Certificates (Managed by Certbot volume)
        ssl_certificate /etc/letsencrypt/live/://giants-of-the-sea.madata.ru;
        ssl_certificate_key /etc/letsencrypt/live/://giants-of-the-sea.madata.ru;

        # Secure Protocols and Cipher Suites (Modern Profile)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA256';

        # Optimize performance via Session Cache
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # Basic security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Serve site content
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
