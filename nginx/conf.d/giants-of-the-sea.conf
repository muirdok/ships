# HTTP - used for ACME challenge + redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name giants-of-the-sea.madata.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - main server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name giants-of-the-sea.madata.ru;

    ssl_certificate     /etc/letsencrypt/live/giants-of-the-sea.madata.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/giants-of-the-sea.madata.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # ---- /download/ endpoint ----
    # Serves plain text files directly (ships.txt, etc.)
    location /download/ {
        alias /usr/share/nginx/html/download/;
        autoindex on;                    # optional: listing page
        autoindex_exact_size off;
        autoindex_localtime on;

        # Force inline display for .txt (viewable in browser)
        # and set correct MIME so it doesn't get treated as HTML
        types {
            text/plain txt;
        }
        default_type text/plain;

        # Allow direct download or inline view
        add_header Content-Disposition "inline";

        # Cache for 1 hour — file can be updated
        expires 1h;
        add_header Cache-Control "public";
    }

    # Prevent Nginx from falling back to index.html inside /download/
    location = /download/ {
        alias /usr/share/nginx/html/download/;
        try_files /index.html =404;      # simple directory listing fallback
    }

    # Long cache for static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/giants.access.log;
    error_log  /var/log/nginx/giants.error.log;
}